name: Cursor PR Agent Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write # Permission required to comment on the PR

jobs:
  cursor-review:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out the PR code and fetches the full git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installs the Cursor CLI on the Linux environment
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      # 3. Runs the Cursor Agent in Headless mode
      - name: Run Cursor Agent Review
        id: cursor_agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # Get the diff of changes compared to the base branch
          git diff origin/${{ github.base_ref }}...HEAD > pr_changes.diff

          # Run the Cursor agent with the prompt
          # The '-p' / print mode runs the agent non-interactively in CI
          OUTPUT=$(agent --trust -p "You are a Senior Software Engineer. Analyze the diff below and perform a detailed code review. Look for possible bugs, performance issues, security flaws, and adherence to best practices. If everything looks good, provide positive feedback. Diff contents: $(cat pr_changes.diff)" --model composer-2.5)

          # Safely save the output to GitHub Actions Output for multi-line handling
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "review_comment<<$EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # 4. Publishes the comment generated by Cursor directly on the PR
      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const reviewText = ${{ toJSON(steps.cursor_agent.outputs.review_comment) }};
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Cursor Agent Review\n\n${reviewText}`
            });